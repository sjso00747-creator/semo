name: Quick APK Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        default: 'update-to-index-with-arabic-support'
        type: string

jobs:
  quick-build:
    name: Quick Build APK
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout specific branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch }}
        
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true
        
    - name: Create environment files
      run: |
        # Create .env file
        cat > .env << EOF
        TMDB_ACCESS_TOKEN=eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJjYTc2MDk3MTlhNTYxYjM0MWM4MDYyYzMzN2FiZTM5NyIsIm5iZiI6MTc0NDI5MzUwOC4xMDQsInN1YiI6IjY3ZjdjZTg0MzE3NzUyNzZkNmQ5OTM4OCIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.jB-LdCFKnX7xETXv3UgAHXffgoCOFK9wfyr6Z8y4AzI
        SUBDL_API_KEY=l0cgAb7VNM_KMN2KwkLCFNuRsk8q3tEg
        EOF
        
        # Ensure firebase_options.dart exists
        if [ ! -f "lib/firebase_options.dart" ]; then
          mkdir -p lib
          cat > lib/firebase_options.dart << 'EOF'
        // File generated by FlutterFire CLI.
        // ignore_for_file: lines_longer_than_80_chars, avoid_classes_with_only_static_members
        import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
        import 'package:flutter/foundation.dart'
            show defaultTargetPlatform, kIsWeb, TargetPlatform;

        /// Default [FirebaseOptions] for use with your Firebase apps.
        class DefaultFirebaseOptions {
          static FirebaseOptions get currentPlatform {
            if (kIsWeb) {
              return web;
            }
            switch (defaultTargetPlatform) {
              case TargetPlatform.android:
                return android;
              case TargetPlatform.iOS:
                return ios;
              case TargetPlatform.macOS:
                return macos;
              case TargetPlatform.windows:
                throw UnsupportedError(
                  'DefaultFirebaseOptions have not been configured for windows - '
                  'you can reconfigure this by running the FlutterFire CLI again.',
                );
              case TargetPlatform.linux:
                throw UnsupportedError(
                  'DefaultFirebaseOptions have not been configured for linux - '
                  'you can reconfigure this by running the FlutterFire CLI again.',
                );
              default:
                throw UnsupportedError(
                  'DefaultFirebaseOptions are not supported for this platform.',
                );
            }
          }

          static const FirebaseOptions web = FirebaseOptions(
            apiKey: 'AIzaSyDummy-Web-Key-For-Index-App',
            appId: '1:123456789:web:abcdef123456',
            messagingSenderId: '123456789',
            projectId: 'index-voxin-app',
            authDomain: 'index-voxin-app.firebaseapp.com',
            storageBucket: 'index-voxin-app.appspot.com',
          );

          static const FirebaseOptions android = FirebaseOptions(
            apiKey: 'AIzaSyDummy-Android-Key-For-Index-App',
            appId: '1:123456789:android:abcdef123456',
            messagingSenderId: '123456789',
            projectId: 'index-voxin-app',
            storageBucket: 'index-voxin-app.appspot.com',
          );

          static const FirebaseOptions ios = FirebaseOptions(
            apiKey: 'AIzaSyDummy-iOS-Key-For-Index-App',
            appId: '1:123456789:ios:abcdef123456',
            messagingSenderId: '123456789',
            projectId: 'index-voxin-app',
            storageBucket: 'index-voxin-app.appspot.com',
            iosBundleId: 'com.voxin.index',
          );

          static const FirebaseOptions macos = FirebaseOptions(
            apiKey: 'AIzaSyDummy-macOS-Key-For-Index-App',
            appId: '1:123456789:ios:abcdef123456',
            messagingSenderId: '123456789',
            projectId: 'index-voxin-app',
            storageBucket: 'index-voxin-app.appspot.com',
            iosBundleId: 'com.voxin.index',
          );
        }
        EOF
        fi
        
        # Ensure env.g.dart exists
        if [ ! -f "lib/utils/env/env.g.dart" ]; then
          mkdir -p lib/utils/env
          cat > lib/utils/env/env.g.dart << 'EOF'
        // GENERATED CODE - DO NOT MODIFY BY HAND

        part of 'env.dart';

        // **************************************************************************
        // EnviedGenerator
        // **************************************************************************

        class _Env {
          static const String tmdbAccessToken = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJjYTc2MDk3MTlhNTYxYjM0MWM4MDYyYzMzN2FiZTM5NyIsIm5iZiI6MTc0NDI5MzUwOC4xMDQsInN1YiI6IjY3ZjdjZTg0MzE3NzUyNzZkNmQ5OTM4OCIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.jB-LdCFKnX7xETXv3UgAHXffgoCOFK9wfyr6Z8y4AzI';
          static const String subdlApiKey = 'l0cgAb7VNM_KMN2KwkLCFNuRsk8q3tEg';
        }
        EOF
        fi
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Build APK
      run: |
        echo "🔨 Building Index APK..."
        flutter build apk --release --verbose
        
    - name: Rename and organize APK
      run: |
        cd build/app/outputs/flutter-apk/
        timestamp=$(date +%Y%m%d-%H%M%S)
        branch_name="${{ github.event.inputs.branch }}"
        
        for file in *.apk; do
          if [ -f "$file" ]; then
            new_name="index-app-${branch_name}-${timestamp}.apk"
            mv "$file" "$new_name"
            echo "📦 Created: $new_name"
            ls -lh "$new_name"
          fi
        done
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: index-app-${{ github.event.inputs.branch }}-${{ github.run_number }}
        path: build/app/outputs/flutter-apk/*.apk
        retention-days: 7
        
    - name: Comment on commit (if from PR)
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          const apkDir = 'build/app/outputs/flutter-apk/';
          const files = fs.readdirSync(apkDir).filter(f => f.endsWith('.apk'));
          
          let comment = '## 📱 APK Build Complete!\n\n';
          comment += '✅ **Index App** has been built successfully from branch `${{ github.event.inputs.branch }}`\n\n';
          comment += '### 📦 Generated Files:\n';
          
          files.forEach(file => {
            const stats = fs.statSync(path.join(apkDir, file));
            const size = (stats.size / (1024 * 1024)).toFixed(2);
            comment += `- **${file}** (${size} MB)\n`;
          });
          
          comment += '\n### 📥 Download:\n';
          comment += 'Check the **Artifacts** section in this workflow run to download the APK.\n\n';
          comment += '---\n';
          comment += '🚀 Built with GitHub Actions | 🏢 Voxin Company';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
          
    - name: Build notification
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Build completed successfully!"
          echo "📦 APK is ready for download from Artifacts"
          echo "🎬 Index App - Your ultimate streaming companion"
        else
          echo "❌ Build failed!"
          echo "Please check the logs for more details"
        fi