name: Build Android APK

on:
  push:
    branches: [ main, update-to-index-with-arabic-support ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
        - release
        - debug

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true
        
    - name: Create .env file
      run: |
        echo "TMDB_ACCESS_TOKEN=eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJjYTc2MDk3MTlhNTYxYjM0MWM4MDYyYzMzN2FiZTM5NyIsIm5iZiI6MTc0NDI5MzUwOC4xMDQsInN1YiI6IjY3ZjdjZTg0MzE3NzUyNzZkNmQ5OTM4OCIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.jB-LdCFKnX7xETXv3UgAHXffgoCOFK9wfyr6Z8y4AzI" > .env
        echo "SUBDL_API_KEY=l0cgAb7VNM_KMN2KwkLCFNuRsk8q3tEg" >> .env
        
    - name: Verify project structure
      run: |
        echo "📁 Project structure:"
        ls -la
        echo "📁 lib directory:"
        ls -la lib/
        echo "📁 android directory:"
        ls -la android/
        
    - name: Flutter doctor
      run: flutter doctor -v
      
    - name: Get dependencies
      run: flutter pub get
      
    - name: Generate code (if needed)
      run: |
        if [ -f "pubspec.yaml" ] && grep -q "build_runner" pubspec.yaml; then
          echo "🔧 Running build_runner..."
          flutter packages pub run build_runner build --delete-conflicting-outputs || echo "⚠️ build_runner failed, continuing..."
        fi
        
    - name: Verify generated files
      run: |
        echo "🔍 Checking generated files:"
        if [ -f "lib/utils/env/env.g.dart" ]; then
          echo "✅ env.g.dart exists"
          head -5 lib/utils/env/env.g.dart
        else
          echo "❌ env.g.dart missing"
        fi
        
        if [ -f "lib/firebase_options.dart" ]; then
          echo "✅ firebase_options.dart exists"
        else
          echo "❌ firebase_options.dart missing"
        fi
        
        if [ -f "lib/gen/assets.gen.dart" ]; then
          echo "✅ assets.gen.dart exists"
        else
          echo "❌ assets.gen.dart missing"
        fi
        
    - name: Analyze code
      run: flutter analyze --no-fatal-infos
      continue-on-error: true
      
    - name: Run tests
      run: flutter test
      continue-on-error: true
      
    - name: Build APK (Debug)
      if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == '' }}
      run: |
        echo "🔨 Building debug APK..."
        flutter build apk --debug --verbose
        
    - name: Build APK (Release)
      if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == '' }}
      run: |
        echo "🔨 Building release APK..."
        flutter build apk --release --verbose
        
    - name: Verify APK build
      run: |
        echo "📦 Checking built APKs:"
        find build/app/outputs/flutter-apk/ -name "*.apk" -exec ls -lh {} \;
        
    - name: Rename APK files
      run: |
        cd build/app/outputs/flutter-apk/
        for file in *.apk; do
          if [[ $file == *"release"* ]]; then
            mv "$file" "index-app-release-$(date +%Y%m%d-%H%M%S).apk"
          elif [[ $file == *"debug"* ]]; then
            mv "$file" "index-app-debug-$(date +%Y%m%d-%H%M%S).apk"
          else
            mv "$file" "index-app-$(date +%Y%m%d-%H%M%S).apk"
          fi
        done
        ls -la
        
    - name: Upload APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: index-app-apk-${{ github.run_number }}
        path: build/app/outputs/flutter-apk/*.apk
        retention-days: 30
        
    - name: Create Release (on main branch)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Index App v1.0.${{ github.run_number }}
        body: |
          🎬 **Index - تطبيق البث المباشر**
          
          ## ✨ الميزات الجديدة:
          - 🌐 دعم اللغة العربية الكامل
          - 👤 تسجيل الدخول كضيف
          - 🎭 واجهة محدثة وعصرية
          - 🔑 مفاتيح TMDB و SUBDL مدمجة
          - 📱 تحسينات في الأداء
          
          ## 🏢 معلومات الشركة:
          - **المطور:** Voxin
          - **الموقع:** https://voxin.netlify.app/
          - **تأسست:** 2021
          
          ## 📥 التحميل:
          حمل ملف APK المرفق وقم بتثبيته على جهاز Android
          
          ---
          
          🚀 **Built with GitHub Actions**
          📅 **Build Date:** ${{ github.event.head_commit.timestamp }}
          🔗 **Commit:** ${{ github.sha }}
        files: build/app/outputs/flutter-apk/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build Summary
      if: always()
      run: |
        echo "## 📊 Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Item | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Flutter Version | $(flutter --version | head -1) |" >> $GITHUB_STEP_SUMMARY
        echo "| Build Type | ${{ github.event.inputs.build_type || 'release' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -d "build/app/outputs/flutter-apk/" ]; then
          echo "### 📦 Built APK Files:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          cd build/app/outputs/flutter-apk/
          for file in *.apk; do
            if [ -f "$file" ]; then
              size=$(ls -lh "$file" | awk '{print $5}')
              echo "| $file | $size |" >> $GITHUB_STEP_SUMMARY
            fi
          done
        fi